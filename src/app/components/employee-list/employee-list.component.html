
<div class="employee-list">
  <div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">Employees</h1>
    <button class="btn btn-primary btn-sm" (click)="openAddEmployeeModal()">
      <i class="fas fa-plus fa-sm text-white-50"></i> Add Employee
    </button>
  </div>

  <!-- Search and Filter -->
  <div class="card shadow mb-4">
    <div class="card-body">
      <div class="row">
        <div class="col-md-4">
          <input type="text" 
                 class="form-control" 
                 placeholder="Search employees..." 
                 [(ngModel)]="searchTerm" 
                 (input)="filterEmployees()">
        </div>
        <div class="col-md-3">
          <select class="form-control" [(ngModel)]="selectedCompany" (change)="filterEmployees()">
            <option value="">All Companies</option>
            <option *ngFor="let company of companies" [value]="company.COMPANYID">
              {{ company.COMPANYNAME }}
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-control" [(ngModel)]="selectedDepartment" (change)="filterEmployees()">
            <option value="">All Departments</option>
            <option *ngFor="let dept of departments" [value]="dept.DEPARTMENTID">
              {{ dept.DEPARTMENT }}
            </option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-secondary" (click)="clearFilters()">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Employee Table -->
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary">Employee List</h6>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-bordered" width="100%" cellspacing="0">
          <thead>
            <tr>
              <th>Employee ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Company</th>
              <th>Department</th>
              <th>Position</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let employee of filteredEmployees">
              <td>{{ employee.EMPLOYID }}</td>
              <td>{{ employee.FNAME }} {{ employee.LNAME }}</td>
              <td>{{ employee.EMAIL }}</td>
              <td>{{ employee.COMPANYNAME }}</td>
              <td>{{ employee.DEPARTMENT }}</td>
              <td>{{ employee.POSITION }}</td>
              <td>
                <span class="badge" 
                      [ngClass]="{
                        'badge-success': employee.STATUS === 'Active',
                        'badge-secondary': employee.STATUS === 'Inactive'
                      }">
                  {{ employee.STATUS }}
                </span>
              </td>
              <td>
                <button class="btn btn-info btn-sm mr-1" (click)="viewEmployee(employee)">
                  <i class="fas fa-eye"></i>
                </button>
                <button class="btn btn-warning btn-sm mr-1" (click)="editEmployee(employee)">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-danger btn-sm" (click)="deleteEmployee(employee)">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
