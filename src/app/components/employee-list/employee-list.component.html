
<div class="row">
  <div class="col-12 d-flex justify-content-between align-items-center mb-4">
    <h2>Employees</h2>
    <a routerLink="/employees/new" class="btn btn-primary">
      <i class="fas fa-plus"></i> Add Employee
    </a>
  </div>
</div>

<div class="row" *ngIf="error">
  <div class="col-12">
    <div class="alert alert-danger">{{ error }}</div>
  </div>
</div>

<div class="row" *ngIf="loading">
  <div class="col-12 text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</div>

<div class="row" *ngIf="!loading">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead class="table-dark">
              <tr>
                <th>Employee ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Company</th>
                <th>Department</th>
                <th>Position</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let employee of employees">
                <td>{{ employee.EMPLOYID }}</td>
                <td>{{ employee.FNAME }} {{ employee.LNAME }}</td>
                <td>{{ employee.EMAIL }}</td>
                <td>{{ employee.COMPANYNAME }}</td>
                <td>{{ employee.DEPARTMENT }}</td>
                <td>{{ employee.POSITION }}</td>
                <td>
                  <span class="badge" 
                        [ngClass]="employee.STATUS === 'Active' ? 'bg-success' : 'bg-danger'">
                    {{ employee.STATUS }}
                  </span>
                </td>
                <td>
                  <a [routerLink]="['/employees/edit', employee.EMPID]" 
                     class="btn btn-sm btn-outline-primary me-2">
                    <i class="fas fa-edit"></i>
                  </a>
                  <button (click)="deleteEmployee(employee.EMPID!)" 
                          class="btn btn-sm btn-outline-danger">
                    <i class="fas fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
